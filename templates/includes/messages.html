{% if messages %}
    <div class="messages-container">
        {% for message in messages %}
            <div class="message message-{{ message.tags }}">
                <span>{{ message }}</span>

                <button
                    type="button"
                    class="message-close"
                    aria-label="Закрыть"
                >
                    ×
                </button>
            </div>
        {% endfor %}
    </div>
{% endif %}
